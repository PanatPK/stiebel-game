<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Stage 1920×1080</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#wrap{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;background:#000}
iframe{width:1920px;height:1080px;border:0;display:block;background:#000}
#tip{position:fixed;left:12px;bottom:10px;font:12px/1.4 system-ui,sans-serif;color:#555;opacity:.6}
</style>
</head>
<body>
<div id="wrap"><iframe id="f" allow="autoplay"></iframe></div>
<div id="tip"></div>
<script>
/* ใช้: stage.html?src=draw.html            → ลัคกี้ดรอว์ ที่ 1920×1080 กลางจอ
        stage.html?src=index.html%23board   → บอร์ดเกม
   ตัวเลือก &scale=fit (ค่าเริ่มต้น ขยายให้เต็มความสูงจอ) หรือ &scale=1 (ขนาดจริง 1920×1080 ไม่ขยาย) */
const q = new URLSearchParams(location.search);
const src = q.get('src') || 'draw.html';
const mode = q.get('scale') || 'fit';
document.getElementById('f').src = src;
function fit() {
  const W = innerWidth, H = innerHeight;
  const s = mode === '1' ? 1 : Math.min(W / 1920, H / 1080);
  document.getElementById('wrap').style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  document.getElementById('tip').textContent = 'stage 1920×1080 → ' + W + '×' + H + ' (scale ' + s.toFixed(3) + ')';
}
addEventListener('resize', fit); fit();
setTimeout(() => document.getElementById('tip').style.display = 'none', 6000);
</script>
</body>
</html>
